name: Publish Repo
run-name: "Publish Repo (strongswan ${{ inputs.strongswan_run_id || github.event.client_payload.strongswan_run_id }} coordinode ${{ inputs.coordinode_run_id || github.event.client_payload.coordinode_run_id }})"

on:
  workflow_dispatch:
    inputs:
      strongswan_run_id:
        description: 'strongswan build-packages run id'
        required: false
        type: string
      coordinode_run_id:
        description: 'coordinode release run id'
        required: false
        type: string
  repository_dispatch:
    types: [publish-from-strongswan, publish-from-coordinode]

permissions:
  contents: write

concurrency:
  # All publishes to the same branch are serialized regardless of source project.
  # A per-run-id group would allow overlapping coordinode/strongswan runs that both
  # mutate and push the repo, increasing push/rebase failure risk.
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Ensure publish runs on main
        run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "Error: publish workflow must run on main (current ref: ${{ github.ref }})" >&2
            exit 1
          fi

      - name: Generate release bot token
        uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf
        id: app-token
        with:
          app-id: ${{ secrets.RELEASER_APP_ID }}
          private-key: ${{ secrets.RELEASER_APP_PRIVATE_KEY }}

      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y apt-utils createrepo-c gnupg python3-pip dpkg-dev jq rpm
          if ! command -v rpmsign >/dev/null 2>&1; then
            echo "Error: rpmsign not found after installing rpm package" >&2
            exit 1
          fi

      - name: Import GPG key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [ -z "${GPG_PRIVATE_KEY:-}" ]; then
            echo "Error: GPG_PRIVATE_KEY is not set" >&2
            exit 1
          fi
          keyfile="$(mktemp)"
          cleanup_keyfile() { rm -f "$keyfile"; }
          previous_trap=$(trap -p EXIT || true)
          trap cleanup_keyfile EXIT
          chmod 600 "$keyfile"
          printf '%s\n' "$GPG_PRIVATE_KEY" > "$keyfile"
          gpg --batch --import "$keyfile"
          trap - EXIT
          cleanup_keyfile
          if [ -n "$previous_trap" ]; then
            eval "$previous_trap"
          fi
          # Fresh runner keyring — the imported key above is the only secret key present.
          gpg_fpr="$(gpg --batch --with-colons --list-secret-keys | awk -F: '/^fpr:/ {print $10; exit}')"
          if [ -z "$gpg_fpr" ]; then
            echo "Error: failed to determine GPG key fingerprint for RPM signing" >&2
            exit 1
          fi
          # %_gpg_path: tilde is expanded by RPM's macro engine, not the shell.
          printf '%s\n' \
            '%_signature gpg' \
            "%_gpg_name ${gpg_fpr}" \
            '%_gpg_path ~/.gnupg' \
            '%__gpg /usr/bin/gpg' \
            > ~/.rpmmacros
          # Import public key into RPM database so rpm --checksig trusts our signatures.
          # /dev/stdin is safe here — workflow runs exclusively on ubuntu-latest (Linux).
          # Use a temp file instead of a pipe so gpg export failure is not masked.
          gpg_pubkey="$(mktemp)"
          if ! gpg --batch --armor --export "$gpg_fpr" > "$gpg_pubkey" || [ ! -s "$gpg_pubkey" ]; then
            rm -f "$gpg_pubkey"
            echo "Error: failed to export GPG public key for RPM database import" >&2
            exit 1
          fi
          rpm --import "$gpg_pubkey"
          rm -f "$gpg_pubkey"
          if [ -n "$GPG_PASSPHRASE" ]; then
            passfile="$(mktemp)"
            chmod 600 "$passfile"
            printf '%s' "$GPG_PASSPHRASE" > "$passfile"
            if ! gpg --batch --yes --pinentry-mode loopback --passphrase-file "$passfile" \
              --output /dev/null --sign --armor /dev/null; then
              rm -f "$passfile"
              echo "Error: GPG passphrase check failed" >&2
              exit 1
            fi
            # Persist passfile so rpmsign can use it via %__gpg_sign_cmd.
            # Runner is ephemeral — passfile is destroyed with the VM after job ends.
            # ${passfile} is intentionally shell-expanded here to embed the absolute
            # path into the RPM macro (RPM cannot resolve shell variables).
            printf '%s\n' \
              "%__gpg_sign_cmd %{__gpg} --batch --yes --pinentry-mode loopback --passphrase-file ${passfile} -u \"%{_gpg_name}\" -sbo %{__signature_filename} %{__plaintext_filename}" \
              >> ~/.rpmmacros
          fi

      - name: Resolve strongswan run id
        id: runid
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            sender=$(jq -r '.sender.login // ""' "$GITHUB_EVENT_PATH")
            action=$(jq -r '.action // ""' "$GITHUB_EVENT_PATH")
            if [ "$sender" != "sw-release-bot[bot]" ]; then
              echo "Error: unauthorized repository_dispatch sender '$sender'" >&2
              exit 1
            fi
            if [ "$action" = "publish-from-coordinode" ]; then
              # This dispatch is for coordinode only; no strongswan run to process.
              echo "run_id=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            source_repo=$(jq -r '.client_payload.strongswan_repo // ""' "$GITHUB_EVENT_PATH")
            if [ "$action" != "publish-from-strongswan" ]; then
              echo "Error: unexpected repository_dispatch action '$action'" >&2
              exit 1
            fi
            if [ "$source_repo" != "structured-world/strongswan" ]; then
              echo "Error: unexpected strongswan_repo '$source_repo'" >&2
              exit 1
            fi
          fi
          if [ -n "${{ github.event.client_payload.strongswan_run_id }}" ]; then
            run_id="${{ github.event.client_payload.strongswan_run_id }}"
          elif [ -n "${{ inputs.strongswan_run_id }}" ]; then
            run_id="${{ inputs.strongswan_run_id }}"
          else
            # No strongswan run id provided — OK if this is a coordinode-only dispatch.
            echo "run_id=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$run_id" ]; then
            echo "Error: resolved strongswan_run_id is empty" >&2
            exit 1
          fi
          if ! echo "$run_id" | grep -Eq '^[0-9]+$'; then
            echo "Error: resolved strongswan_run_id must be numeric, got '$run_id'" >&2
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download strongswan artifacts
        if: steps.runid.outputs.run_id != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          RUN_ID="${{ steps.runid.outputs.run_id }}"
          REPO="structured-world/strongswan"
          echo "Verifying workflow run $RUN_ID in $REPO..."
          if ! run_json=$(gh run view "$RUN_ID" -R "$REPO" --json status,headBranch,event,workflowName,createdAt,updatedAt); then
            echo "Error: unable to view run $RUN_ID in $REPO. The run may not exist, or there may be authentication or network connectivity issues." >&2
            exit 1
          fi
          jq -r '. as $r | "Status: \($r.status)\nBranch: \($r.headBranch)\nEvent: \($r.event)\nWorkflow: \($r.workflowName)\nCreated: \($r.createdAt)\nUpdated: \($r.updatedAt)"' <<< "$run_json"
          run_workflow=$(jq -r '.workflowName // ""' <<< "$run_json")
          if [ "$run_workflow" != "Build Packages" ]; then
            echo "Error: run $RUN_ID is not from expected workflow (Build Packages), got '$run_workflow'" >&2
            exit 1
          fi
          # Do NOT check run completion status here. The trigger-repo job in
          # build-packages.yml fires after all build jobs pass (needs: [build-deb, build-rpm]),
          # so artifacts are already uploaded. Checking run completion would deadlock:
          # publish waits for strongswan run → strongswan release waits for publish.
          mkdir -p packages
          # NOTE: Each project requires its own workflow input + download step below.
          # This is intentional — each source repo has different artifact patterns,
          # run ID inputs, and validation needs.  build-docs.py auto-discovers all
          # manifests in packages/meta/*/, so site generation is already agnostic;
          # only the artifact download is per-project.
          # We download from the workflow run (not a release) to avoid a circular
          # dependency (repo publish → source release → repo publish).
          if ! gh run download "$RUN_ID" -R structured-world/strongswan -D packages \
            --pattern "deb-*" \
            --pattern "rpm-fc*" \
            --pattern "srpm" \
            --pattern "repo-meta-*"; then
            echo "Error: failed to download artifacts for run $RUN_ID" >&2
            exit 1
          fi
          if find packages -maxdepth 1 -type f | grep -q .; then
            echo "Error: unexpected files found at packages/ root; refusing to proceed" >&2
            find packages -maxdepth 1 -type f -print >&2
            exit 1
          fi
          if find packages -mindepth 1 -maxdepth 1 -type d ! -name 'deb-*' ! -name 'rpm-fc*' ! -name 'srpm' ! -name 'repo-meta-*' | grep -q .; then
            echo "Error: unexpected artifact directories found in packages/" >&2
            find packages -mindepth 1 -maxdepth 1 -type d ! -name 'deb-*' ! -name 'rpm-fc*' ! -name 'srpm' ! -name 'repo-meta-*' -print >&2
            exit 1
          fi
          ls -la packages
          if ! find packages -type f | grep -q .; then
            echo "Error: no artifacts found in packages/ for run $RUN_ID" >&2
            exit 1
          fi
          if ! find packages -type f \( -name '*.rpm' -o -name '*.deb' \) | grep -q .; then
            echo "Error: no RPM/DEB artifacts found in packages/ for run $RUN_ID" >&2
            exit 1
          fi
          # repo-meta-* may contain .json and .md files; only validate package dirs.
          if find packages -type f -not -path '*/repo-meta-*/*' ! \( -name '*.rpm' -o -name '*.deb' \) | grep -q .; then
            echo "Error: unexpected artifact types found in packages/ (only .rpm/.deb allowed outside repo-meta)" >&2
            find packages -type f -not -path '*/repo-meta-*/*' ! \( -name '*.rpm' -o -name '*.deb' \) -print >&2
            exit 1
          fi
          # Reject any symlinks to avoid path traversal from downloaded artifacts.
          if find packages -type l | grep -q .; then
            echo "Error: unexpected symlinks found in packages/; refusing to proceed" >&2
            find packages -type l -print >&2
            exit 1
          fi

      - name: Resolve coordinode run id
        id: coordinode-runid
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            action=$(jq -r '.action // ""' "$GITHUB_EVENT_PATH")
            if [ "$action" = "publish-from-strongswan" ]; then
              # This dispatch is for strongswan only; no coordinode run to process.
              echo "run_id=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            source_repo=$(jq -r '.client_payload.coordinode_repo // ""' "$GITHUB_EVENT_PATH")
            if [ "$source_repo" != "structured-world/coordinode" ]; then
              echo "Error: unexpected coordinode_repo '$source_repo'" >&2
              exit 1
            fi
          fi
          if [ -n "${{ github.event.client_payload.coordinode_run_id }}" ]; then
            run_id="${{ github.event.client_payload.coordinode_run_id }}"
          elif [ -n "${{ inputs.coordinode_run_id }}" ]; then
            run_id="${{ inputs.coordinode_run_id }}"
          else
            # No coordinode run id provided — OK if this is a strongswan-only dispatch.
            echo "run_id=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$run_id" ]; then
            echo "Error: resolved coordinode_run_id is empty" >&2
            exit 1
          fi
          if ! echo "$run_id" | grep -Eq '^[0-9]+$'; then
            echo "Error: resolved coordinode_run_id must be numeric, got '$run_id'" >&2
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Validate source run IDs
        run: |
          if [ -z "${{ steps.runid.outputs.run_id }}" ] && [ -z "${{ steps.coordinode-runid.outputs.run_id }}" ]; then
            echo "Error: no source workflow run id was resolved — provide strongswan_run_id or coordinode_run_id" >&2
            exit 1
          fi

      - name: Download coordinode artifacts
        if: steps.coordinode-runid.outputs.run_id != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          RUN_ID="${{ steps.coordinode-runid.outputs.run_id }}"
          REPO="structured-world/coordinode"
          echo "Verifying workflow run $RUN_ID in $REPO..."
          if ! run_json=$(gh run view "$RUN_ID" -R "$REPO" --json status,headBranch,event,workflowName,createdAt,updatedAt); then
            echo "Error: unable to view run $RUN_ID in $REPO. Verify that the run exists, that GH_TOKEN has permission to read workflow runs/artifacts in $REPO, and that there is no GitHub API or network issue." >&2
            exit 1
          fi
          jq -r '. as $r | "Status: \($r.status)\nBranch: \($r.headBranch)\nEvent: \($r.event)\nWorkflow: \($r.workflowName)\nCreated: \($r.createdAt)\nUpdated: \($r.updatedAt)"' <<< "$run_json"
          run_workflow=$(jq -r '.workflowName // ""' <<< "$run_json")
          if [ "$run_workflow" != "Release" ]; then
            echo "Error: run $RUN_ID is not from expected workflow (Release), got '$run_workflow'" >&2
            exit 1
          fi
          mkdir -p packages
          if ! gh run download "$RUN_ID" -R "$REPO" -D packages \
            --pattern "deb-*" \
            --pattern "rpm-fc*" \
            --pattern "repo-meta-coordinode"; then
            echo "Error: failed to download artifacts for run $RUN_ID" >&2
            exit 1
          fi
          # Reject any symlinks to avoid path traversal from downloaded artifacts.
          if find packages -type l | grep -q .; then
            echo "Error: unexpected symlinks found in packages/; refusing to proceed" >&2
            find packages -type l -print >&2
            exit 1
          fi
          if find packages -maxdepth 1 -type f | grep -q .; then
            echo "Error: unexpected files found at packages/ root; refusing to proceed" >&2
            find packages -maxdepth 1 -type f -print >&2
            exit 1
          fi
          if find packages -mindepth 1 -maxdepth 1 -type d \
              ! -name 'deb-*' ! -name 'rpm-fc*' ! -name 'srpm' ! -name 'repo-meta-*' | grep -q .; then
            echo "Error: unexpected artifact directories found in packages/" >&2
            find packages -mindepth 1 -maxdepth 1 -type d \
              ! -name 'deb-*' ! -name 'rpm-fc*' ! -name 'srpm' ! -name 'repo-meta-*' -print >&2
            exit 1
          fi
          # Verify at least one coordinode .deb or .rpm was downloaded.
          if ! find packages -type f \( -name 'coordinode*.deb' -o -name 'coordinode*.rpm' \) | grep -q .; then
            echo "Error: no coordinode RPM/DEB artifacts found in packages/ for run $RUN_ID" >&2
            exit 1
          fi
          # Reject unexpected file types (only .rpm/.deb allowed outside repo-meta-*).
          if find packages -type f -not -path '*/repo-meta-*/*' \
              ! \( -name '*.rpm' -o -name '*.deb' \) | grep -q .; then
            echo "Error: unexpected artifact types found in packages/ (only .rpm/.deb allowed outside repo-meta)" >&2
            find packages -type f -not -path '*/repo-meta-*/*' \
              ! \( -name '*.rpm' -o -name '*.deb' \) -print >&2
            exit 1
          fi
          ls -la packages

      - name: Prepare package metadata
        run: |
          # Copy repo-meta-* artifacts into packages/meta/<project>/ for build-docs.py.
          # Artifact contents are copied as-is; build-docs.py looks for manifest.json inside each dir.
          if ls -d packages/repo-meta-* 2>/dev/null | grep -q .; then
            mkdir -p packages/meta
            for meta_dir in packages/repo-meta-*; do
              [ -d "$meta_dir" ] || continue
              project="${meta_dir##*/repo-meta-}"
              mkdir -p "packages/meta/$project"
              cp -r "$meta_dir"/. "packages/meta/$project/"
              echo "Prepared metadata for project: $project"
            done
          fi
          # Backfill any project not covered by downloaded artifacts from committed manifests/.
          # build-docs.py uses packages/meta when non-empty, ignoring manifests/ entirely.
          # Without backfill, a single-project publish would drop the other project's docs.
          if [ -d packages/meta ]; then
            for committed_dir in manifests/*/; do
              [ -d "$committed_dir" ] || continue
              project="${committed_dir%/}"
              project="${project##*/}"
              if [ ! -f "packages/meta/$project/manifest.json" ]; then
                mkdir -p "packages/meta/$project"
                cp -rn "$committed_dir". "packages/meta/$project/"
                echo "Backfilled manifest for project: $project (from committed manifests/)"
              fi
            done
          fi

      - name: Update package repositories
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          chmod +x scripts/update-repos.sh
          if [ -d packages ]; then
            mkdir -p packages/deb packages/rpm packages/srpm
            for dir in packages/deb-*; do
              [ -d "$dir" ] || continue
              find "$dir" -type f -name '*.deb' -exec mv -n {} packages/deb/ \;
            done
            for dir in packages/rpm-fc*; do
              [ -d "$dir" ] || continue
              find "$dir" -type f -name '*.rpm' -exec mv -n {} packages/rpm/ \;
            done
            # srpm artifact downloads directly into packages/srpm/ — no move needed.
            # deb-*/rpm-fc* need flattening because each matrix job creates a separate artifact.
          fi
          scripts/update-repos.sh

      - name: Build docs
        run: |
          # Pinned until markdown v4 output (toc extension + toc_tokens shape) is validated against docs templates.
          python3 -m pip install --user "markdown>=3.6,<4"
          SITE_BASE_URL=https://repo.sw.foundation python3 scripts/build-docs.py

      - name: Cleanup downloaded packages
        run: |
          rm -rf packages

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if ! git diff --quiet || ! git diff --cached --quiet; then
            git stash push -u -m "publish-workflow" >/dev/null
            stashed=1
          else
            stashed=0
          fi
          if ! git rebase origin/main; then
            echo "Error: rebase failed; manual intervention required" >&2
            git rebase --abort || true
            exit 1
          fi
          if [ "$stashed" -eq 1 ]; then
            if ! git stash apply >/dev/null; then
              echo "Error: failed to restore stashed changes after rebase; stash entry preserved for manual recovery" >&2
              exit 1
            fi
          fi
          if [ -d deb ]; then
            git add deb
          fi
          if [ -d rpm ]; then
            git add rpm
          fi
          if [ -d docs ]; then
            git add docs
          fi
          if [ -f sitemap.xml ]; then
            git add sitemap.xml
          fi
          if [ -f sitemap.txt ]; then
            git add sitemap.txt
          fi
          if [ -f robots.txt ]; then
            git add robots.txt
          fi
          if [ -f index.html ]; then
            git add index.html
          fi
          git status

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            msg="Publish packages"
            [ -n "${{ steps.runid.outputs.run_id }}" ] && msg="$msg (strongswan ${{ steps.runid.outputs.run_id }})"
            [ -n "${{ steps.coordinode-runid.outputs.run_id }}" ] && msg="$msg (coordinode ${{ steps.coordinode-runid.outputs.run_id }})"
            git commit -m "$msg"
            if ! git push; then
              echo "Error: git push failed; manual retry required" >&2
              exit 1
            fi
          fi
