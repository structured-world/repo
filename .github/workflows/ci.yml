name: CI

on:
  pull_request:
    paths:
      - "scripts/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/publish.yml"
      - ".github/workflows/plugins.yml"
      - ".agents/plugins/**"
      - "templates/**"
      - "manifests/plugins/**"
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/publish.yml"
      - ".github/workflows/plugins.yml"
      - ".agents/plugins/**"
      - "templates/**"
      - "manifests/plugins/**"

permissions:
  contents: read

jobs:
  update-repos:
    name: update-repos.sh on an empty tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install repository tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq -y --no-install-recommends \
            apt-utils dpkg-dev gnupg gzip createrepo-c rpm shellcheck python3-yaml jq

      - name: shellcheck
        run: shellcheck -S warning scripts/update-repos.sh scripts/test-update-repos.sh

      - name: Publish two throwaway debs into an empty tree
        run: bash scripts/test-update-repos.sh

      - name: Require independent source and binary Tetherloom artifacts
        run: python3 scripts/test-tetherloom-artifacts.py

      - name: Verify publication artifact lifecycle
        run: python3 scripts/test-tetherloom-publication.py

  build-docs:
    name: build-docs.py install cards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install the Markdown renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq -y --no-install-recommends python3-markdown

      - name: Each install card shows its own project's platforms
        run: python3 scripts/test-build-docs.py

      - name: Verify plugin release admission and catalog rendering
        run: |
          python3 -B scripts/test-plugin-marketplace.py
          python3 -B scripts/test-plugin-catalog.py

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Register the real catalog in a clean Codex profile
        run: |
          npm install --prefix "$RUNNER_TEMP/codex-cli" --no-save --no-package-lock @openai/codex@0.163.0
          python3 -B scripts/qualify-codex-marketplace.py --codex "$RUNNER_TEMP/codex-cli/node_modules/.bin/codex"
