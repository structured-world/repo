name: CI

on:
  pull_request:
    paths:
      - "scripts/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/publish.yml"
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/publish.yml"

permissions:
  contents: read

jobs:
  update-repos:
    name: update-repos.sh on an empty tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install repository tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq -y --no-install-recommends \
            apt-utils dpkg-dev gnupg gzip createrepo-c rpm shellcheck python3-yaml jq

      - name: shellcheck
        run: shellcheck -S warning scripts/update-repos.sh scripts/test-update-repos.sh

      - name: Publish two throwaway debs into an empty tree
        run: bash scripts/test-update-repos.sh

      - name: Require independent source and binary Tetherloom artifacts
        run: python3 scripts/test-tetherloom-artifacts.py

      - name: Verify publication artifact lifecycle
        run: python3 scripts/test-tetherloom-publication.py

  build-docs:
    name: build-docs.py install cards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install the Markdown renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq -y --no-install-recommends python3-markdown

      - name: Each install card shows its own project's platforms
        run: python3 scripts/test-build-docs.py
